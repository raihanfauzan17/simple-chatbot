<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDISON - Asisten P3K</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="chatbot-wrapper">
    <header class="chat-header">
      <div class="header-container">
        <h1 class="logo">EDISON P3K</h1>
        <button id="clear-btn" class="btn-clear">Hapus Riwayat</button>
      </div>
    </header>

    <!-- Chat Box -->
    <main class="chat-box" id="chat-box">
      <!-- Balon awal chatbot -->
      <div class="message bot">
        <div class="avatar">🤖</div>
        <div class="msg-content">
          <p class="sender-name">EDISON</p>
          <p class="msg-text">Halo! Saya asisten P3K Anda. Ada keluhan gejala ringan atau cedera awal yang ingin Anda
            tanyakan?</p>
        </div>
      </div>
    </main>

    <!-- Input Form -->
    <footer class="chat-footer">
      <form id="chat-form" class="form-container">
        <input type="text" id="user-input" placeholder="Ketik keluhan (contoh: pertolongan pertama luka bakar)..."
          class="input-message" autocomplete="off" required>
        <button type="submit" class="btn-send">Kirim</button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
